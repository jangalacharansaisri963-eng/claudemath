[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claudemath"
version = "0.1"
description = "A comprehensive, advanced pure-Python mathematics library featuring 1,400+ mathematical algorithms across 20 mathematical domains."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "claudemath contributors" }
]

keywords = [
    "math",
    "mathematics",
    "pure-python",
    "calculus",
    "algebra",
    "trigonometry",
    "linear-algebra",
    "matrix",
    "statistics",
    "probability",
    "number-theory",
    "geometry",
    "combinatorics",
    "differential-equations",
    "fourier-analysis",
    "graph-theory",
    "numerical-analysis",
    "polynomial",
    "vectors"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education"
]

[project.urls]
Homepage = "https://github.com/jangalacharansaisri963-eng/claudemath"
Repository = "https://github.com/jangalacharansaisri963-eng/claudemath"
Issues = "https://github.com/jangalacharansaisri963-eng/claudemath/issues"

[project.scripts]
claudemath = "claudemath.cli:main"

[tool.setuptools.packages.find]
include = ["claudemath*"]
